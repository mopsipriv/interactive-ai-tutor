services:
  mysql:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    container_name: peppi-mysql
    restart: always
    env_file:
      - agents/.env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-${DB_PASSWORD}}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - ./database/setup.sql:/docker-entrypoint-initdb.d/setup.sql
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-${DB_PASSWORD}}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mcp_server:
    build: .
    container_name: peppi-mcp
    restart: unless-stopped
    env_file:
      - agents/.env
    command: fastmcp run mcp_server.py --transport sse --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - chroma_data:/app/chroma_db
    environment:
      - DB_HOST=peppi-mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    depends_on:
      mysql:
        condition: service_healthy

  router:
    build: .
    container_name: peppi-router
    restart: unless-stopped
    env_file:
      - agents/.env
    command: python -m agents.smart_router
    ports:
      - "127.0.0.1:8080:8080"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - chroma_data:/app/chroma_db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    environment:
      - DB_HOST=peppi-mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - LLM_PROVIDER=${LLM_PROVIDER:-deepseek}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ROUTER_API_KEY=${ROUTER_API_KEY:-}
      - MAX_LLM_HISTORY_MESSAGES=${MAX_LLM_HISTORY_MESSAGES:-6}
      - SESSION_TTL_HOURS=${SESSION_TTL_HOURS:-24}
      - ROUTER_PORT=8080
    depends_on:
      mysql:
        condition: service_healthy
      mcp_server:
        condition: service_started

  app:
    build: .
    container_name: peppi-app
    restart: always
    env_file:
      - agents/.env
    command: python -m agents.draft_graph
    stdin_open: true
    tty: true
    environment:
      - DB_HOST=peppi-mysql
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - MCP_URL=http://mcp_server:8000/sse
      - PYTHONUNBUFFERED=1
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - GATEWAY_AUTH_TOKEN=${GATEWAY_AUTH_TOKEN}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - TELEGRAM_OWNER_ID=${TELEGRAM_OWNER_ID}
      - NODE_COMPILE_CACHE=/var/tmp/openclaw-compile-cache
      - OPENCLAW_NO_RESPAWN=1
    depends_on:
      mysql:
        condition: service_healthy
      mcp_server:
        condition: service_started

volumes:
  mysql_data:
  chroma_data:
